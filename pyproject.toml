[project]
name = "heart-disease-baseline"
version = "0.1.0"
description = "Учебный проект по млопс"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "lightgbm==4.6.0",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
]

[dependency-groups]
dev = [
    "pre-commit==4.2.0",
    "ruff==0.11.13",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
